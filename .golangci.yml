version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # Best-effort calls whose errors are deliberately ignored.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - os.RemoveAll
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*text/tabwriter.Writer).Flush
        - (*github.com/fsnotify/fsnotify.Watcher).Close
        - (*github.com/romero927/lookout/internal/store.Store).Close
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
